<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartFarm live telemetry</title><link rel="stylesheet" href="/demo/style.css"></head>
<body><header><div><p class="eyebrow">MUGVN · SINGLE FARM</p><h1>SmartFarm telemetry</h1><p>Independent node updates · recorded sensor data replay</p></div><div><span id="user"></span><button id="login">Sign in</button><button id="logout" hidden>Sign out</button></div></header>
<main><section class="toolbar"><p id="status" role="status">Connecting…</p><button id="refresh">Refresh snapshot</button></section><section id="devices" class="grid" aria-label="Latest node measurements"></section>
<section class="history"><h2>Measurement history</h2><p>Times below are UTC. EC and light retain the dataset’s numerical scales.</p><div class="filters"><label>Device <select id="node"></select></label><label>From (UTC) <input id="from" type="datetime-local"></label><label>To (UTC, exclusive) <input id="to" type="datetime-local"></label><button id="load-history">Load history</button></div><canvas id="chart" width="1000" height="320" aria-label="Air temperature history and hourly means"></canvas><p id="history-status" role="status"></p></section></main><script src="/demo/app.js" defer></script></body></html>
