datadog_agent_url http://datadog-agent:8126;
datadog_propagation_styles tracecontext datadog;
# $request and $request_uri contain query strings (including SignalR access tokens).
log_format smartfarm '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent trace_id=$datadog_trace_id span_id=$datadog_span_id';

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log smartfarm;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $smartfarm_api http://api:8080;
    datadog_service_name smartfarm-frontend;
    datadog_environment local;
    datadog_version ${SMARTFARM_VERSION};
    datadog_sample_rate ${SMARTFARM_TRACE_SAMPLE_RATE};
    datadog_tag http.url "$scheme://$host$uri";
    datadog_tracing off;

    location /api/ {
        datadog_tracing on;
        datadog_resource_name "$request_method /api/";
        proxy_pass $smartfarm_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /hubs/telemetry {
        proxy_pass $smartfarm_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location = /demo/config.json {
        datadog_tracing on;
        proxy_pass $smartfarm_api;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
